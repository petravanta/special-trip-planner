<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Special Trip Planner</title>
<meta name="description" content="Plan a higher-stakes trip (a surgery, a hike, a festival, a conference) from a template written by people who have done it before.">
<meta name="theme-color" content="#ffffff">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Shared look: petravanta's apps =====
   Canonical copy of the tokens, type and components used by Fitness Coach and Skating Mentor (and this hub).
   Apps currently inline this block between "Shared look" and "end shared look"; update both when it changes.
   Each app only overrides the --accent values after this block. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e3e9ec; --line:#cdd6db; --ink:#14212a; --muted:#566771; --faint:#8a99a2;
  --lv-new:#9aa8b0; --lv-learn:#c07a00; --lv-dev:#2f6fd0; --lv-conf:#11897a; --lv-solid:#0c5e3e;
  --lv-learn-bg:#fbefd9; --lv-dev-bg:#e1ebfa; --lv-conf-bg:#d9f1ec; --lv-solid-bg:#d5eadf;
  --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunk:#111a20; --line:#2a3842; --ink:#e4ecf0; --muted:#9fb0ba; --faint:#6b7d88;
  --lv-new:#64757f; --lv-learn:#e6a33a; --lv-dev:#6ea0f0; --lv-conf:#3cc3ad; --lv-solid:#6fd39a;
  --lv-learn-bg:#3a2a10; --lv-dev-bg:#182a45; --lv-conf-bg:#0f3530; --lv-solid-bg:#143224;
  --danger:#ff8a80; --danger-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:none}
.save-state{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 80px}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;min-width:0}
textarea{resize:vertical}
.ctx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:720px){.ctx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctx-note{font-size:13px;color:var(--muted);margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.l1{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.l2{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.l3{background:var(--lv-conf-bg);color:var(--lv-conf)}
.pill.l4{background:var(--lv-solid-bg);color:var(--lv-solid)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.35);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));background:var(--sunk);border:0;border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
@media (max-width:640px){.drawer .x{top:12px}}
.drawer h2{padding-right:40px}
.drawer ul,.cues{margin:0;padding-left:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.entry .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
/* ===== end shared look ===== */
/* Special Trip Planner accent: blue */
:root{--accent:#1d6fb8;--accent-ink:#ffffff;--accent-soft:#e0ecf8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#6cb4ff;--accent-ink:#06182b;--accent-soft:#132a42}}
:root[data-theme="dark"]{--accent:#6cb4ff;--accent-ink:#06182b;--accent-soft:#132a42}

.plan-pick{display:flex;align-items:center;gap:8px;margin-left:auto}
.plan-pick select{max-width:52vw}
.snapshot{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item:first-of-type{border-top:0}
.item-head{display:flex;gap:8px;align-items:flex-start}
.item-head .t{flex:1;font-weight:600}
.item-head .tools{display:flex;gap:4px;flex:none}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;color:var(--muted);padding:2px 6px;font-size:13px}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.why{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.why b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.why .src{font-size:12px;color:var(--muted)}
.why .src a{color:inherit}
.nudge{font-size:13px;color:var(--lv-learn)}
.when{font-size:13px;color:var(--muted)}
details.more>summary{cursor:pointer;font-size:13px;color:var(--accent);list-style:none;padding:2px 0;width:fit-content}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'▸';display:inline-block;width:1em;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
details.more[open]{display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);width:fit-content}
.seg button{border:0;background:none;color:var(--muted);padding:4px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:12px;height:12px;border-radius:3px;flex:none}
.cal-legend i.kd{border-radius:50%;background:none;border:2px solid var(--ink);width:10px;height:10px}
.cal-month h3{margin:0 0 6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-grid .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-day{position:relative;min-height:52px;border:0;border-radius:6px;background:var(--sunk);color:var(--ink);padding:4px 4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font:inherit;text-align:left;cursor:pointer}
.cal-day.out{background:none;cursor:default}
.cal-day .n{font-size:12px;font-variant-numeric:tabular-nums;line-height:1.2;display:flex;align-items:center;gap:3px}
.cal-day.kd .n b{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink);flex:none}
.cal-day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-day .bars{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.cal-day .bars i{display:block;height:5px;border-radius:2px}
.cal-day .kl{font-size:10px;line-height:1.15;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (min-width:640px){.cal-day{min-height:68px}.cal-day .n{font-size:13px}.cal-day .kl{font-size:11px}}
:root{--ph-purple:#7b4fc4;--ph-coral:#c8553d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ph-purple:#b18cf0;--ph-coral:#f08a72}}
:root[data-theme="dark"]{--ph-purple:#b18cf0;--ph-coral:#f08a72}
.ph0{background:var(--lv-dev)}.ph1{background:var(--lv-learn)}.ph2{background:var(--lv-conf)}.ph3{background:var(--ph-purple)}.ph4{background:var(--ph-coral)}.ph5{background:var(--lv-new)}
.pill.must{background:var(--danger-soft);color:var(--danger)}
.pill.should{background:var(--lv-learn-bg);color:var(--lv-learn)}
.pill.tip,.pill.optional{background:var(--sunk);color:var(--muted)}
.pill.recommended{background:var(--lv-dev-bg);color:var(--lv-dev)}
.pill.basis{background:var(--accent-soft);color:var(--accent)}
.pill.private{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.phase-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.phase-now{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check .t{font-weight:600}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar h2{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.card .grow{flex:1}
.hero{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px}
.hero p{max-width:62ch}
.status-sel{min-width:110px}
.form{display:flex;flex-direction:column;gap:12px}
.form .inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form .inline > *{flex:1 1 120px}
.form .inline input[type=number]{width:80px}
.form label.cb{display:flex;gap:8px;align-items:center;font-size:14px}
input[type=date],input[type=time],input[type=email],input[type=tel],input[type=url]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;min-width:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
pre.json{background:var(--sunk);border-radius:8px;padding:10px;font-size:12px;max-height:260px;overflow:auto;font-family:var(--f-mono)}
.err{color:var(--danger);font-size:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26 13 9l5 9 3-5 7 13z" fill="var(--accent)"/><circle cx="23" cy="7" r="3" fill="var(--ink)"/></svg>

      </div>
      <div class="plan-pick" id="planPick"></div>

</header>
<main class="wrap" id="main"></main>

<script>
'use strict';
/* Special Trip Planner. Templates hold what experienced people know about a kind of trip; a plan is a private
   copy of one (its "knowledge") plus private tracking that never leaves the person's own storage.
   User data follows the "User data" section of petravanta/general STANDARDS.md. */

const STORE_KEY = 'specialTripPlanner.data';
const FORMAT = 'special-trip-template';
const LISTS = ['rules', 'meds', 'packing', 'food', 'contacts', 'logistics', 'daily'];
const PRIVATE_LISTS = ['regimens', 'doses', 'checks', 'packStatus', 'bookings', 'people', 'journal'];
const TABS = [
  ['today', 'Today'], ['timeline', 'Timeline & rules'], ['meds', 'Meds & health'], ['packing', 'Packing'],
  ['food', 'Food'], ['contacts', 'Contacts & places'], ['logistics', 'Logistics'], ['journal', 'Journal'],
  ['library', 'Templates'], ['settings', 'Settings']
];
const LABELS = {
  kind: {do: 'Do', avoid: 'Avoid', limit: 'Limit'},
  strength: {must: 'Must', should: 'Should', tip: 'Tip'},
  need: {must: 'Must have', recommended: 'Recommended', optional: 'Optional'},
  how: {bring: 'Bring from home', 'buy-before': 'Buy before', 'buy-there': 'Buy there', 'rent-there': 'Rent there', provided: 'Provided'},
  basis: {official: 'Official', evidence: 'Evidence', experience: 'Experience'},
  status: {need: 'Still need', ordered: 'Ordered', have: 'Have it', packed: 'Packed'},
  repeat: {once: 'Once', daily: 'Daily', 'twice-daily': 'Twice a day', 'three-times-daily': 'Three times a day', weekly: 'Weekly'},
  tripType: {medical: 'Medical stay', hiking: 'Hiking', festival: 'Festival', conference: 'Conference', other: 'Other'},
  dailyKind: {activity: 'Activity', appointment: 'Appointment', med: 'Med', meal: 'Meal', task: 'Task'},
  medCat: {pain: 'Pain', antibiotic: 'Antibiotic', 'blood-thinner': 'Blood thinner', bowel: 'Bowel', nausea: 'Nausea', sleep: 'Sleep', allergy: 'Allergy', altitude: 'Altitude', skin: 'Skin', supplement: 'Supplement', other: 'Other'},
  rx: {prescription: 'Prescription', 'over-the-counter': 'Over the counter'},
  contactKind: {person: 'Person', organization: 'Organization', place: 'Place'},
  logKind: {travel: 'Travel', lodging: 'Lodging', ticket: 'Ticket', permit: 'Permit', transport: 'Transport', insurance: 'Insurance', other: 'Other'}
};
const SLOTS = {once: 1, daily: 1, 'twice-daily': 2, 'three-times-daily': 3, weekly: 1};
const SLOT_NAMES = {1: [''], 2: ['Morning', 'Evening'], 3: ['Morning', 'Midday', 'Evening']};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => (String(s || 'item').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'item');
const newItemId = s => `${slug(s)}-${Math.random().toString(36).slice(2, 6)}`;
const pad = n => String(n).padStart(2, '0');
const dayStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const endOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
const fmtDay = d => d.toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'});
const fmtLong = d => d.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
const fmtTime = d => d.toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
const todayStr = () => dayStr(new Date());
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);

/* ---------- storage ---------- */
function emptyState() {
  const s = {version: 1, settings: {currentPlan: null, updatedAt: ''}, templates: [], plans: [], deleted: []};
  for (const k of PRIVATE_LISTS) s[k] = [];
  return s;
}
function fixState(j) {
  const s = emptyState();

    if (a.kind === 'range') { const e = anchorMoment(plan, `${a.id}:end`); if (e && +e.day !== +s.day) keys.push({day: e.day, label: `${a.label} ends`}); }
  }
  if (!placedPh.length && !keys.length) return `<div class="panel"><p class="empty">Set your key dates to see the phases on a calendar.</p><button class="btn sm" data-act="editPlan">Set my dates</button></div>`;
  const pts = [...placedPh.flatMap(x => [startOfDay(x.w.start), startOfDay(x.w.end)]), ...keys.map(k => k.day)];
  const first = new Date(Math.min(...pts)), last = new Date(Math.max(...pts));
  const today = startOfDay(new Date());
  const legend = `<div class="cal-legend">${placedPh.map(x => `<span><i class="ph${x.c}"></i>${esc(x.p.name)} <span class="muted">${esc(winDates(x.w))}</span></span>`).join('')}${keys.length ? '<span><i class="kd"></i>Key date</span>' : ''}</div>`;
  const unplaced = phases.filter(x => !x.w).map(x => x.p.name);
  const dows = Array.from({length: 7}, (_, i) => addDays(new Date(2024, 0, 1), i).toLocaleDateString(undefined, {weekday: 'narrow'}));
  const months = [];
  for (let m = new Date(first.getFullYear(), first.getMonth(), 1); m <= last && months.length < 18; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const lead = (m.getDay() + 6) % 7, len = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const cells = Array.from({length: lead}, () => '<span class="cal-day out" aria-hidden="true"></span>');
    for (let n = 1; n <= len; n++) {
      const d = new Date(m.getFullYear(), m.getMonth(), n);
      const on = placedPh.filter(x => overlapsDay(x.w, d)), kd = keys.filter(k => +k.day === +d);
      const label = [fmtLong(d), ...on.map(x => x.p.name), ...kd.map(k => k.label)].join('. ');
      cells.push(`<button class="cal-day${kd.length ? ' kd' : ''}${+d === +today ? ' today' : ''}" data-act="calDay" data-day="${dayStr(d)}" aria-label="${esc(label)}"><span class="n">${kd.length ? '<b></b>' : ''}${n}</span>${kd.length ? `<span class="kl">${esc(kd.map(k => k.label).join(', '))}</span>` : ''}<span class="bars">${on.map(x => `<i class="ph${x.c}" title="${esc(x.p.name)}"></i>`).join('')}</span></button>`);
    }
    months.push(`<div class="cal-month"><h3>${esc(m.toLocaleDateString(undefined, {month: 'long', year: 'numeric'}))}</h3><div class="cal-grid">${dows.map(x => `<span class="dow" aria-hidden="true">${esc(x)}</span>`).join('')}${cells.join('')}</div></div>`);
  }
  return `<div class="panel stack">${legend}${unplaced.length ? `<p class="small muted">Not on the calendar until their key dates are set: ${esc(unplaced.join(', '))}.</p>` : ''}${months.join('')}<p class="small muted">Tap a day to open it in Today.</p></div>`;
}

/* ---------- drawers and forms ---------- */
function openDrawer(title, inner, onSubmit) {
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="x" data-act="close" aria-label="Close">×</button><h2>${esc(title)}</h2><form class="form" id="dform">${inner}</form></aside>`;
  const f = $('#dform');
  f.onsubmit = e => { e.preventDefault(); if (onSubmit(new FormData(f), f) !== false) closeDrawer(); };
  setTimeout(() => f.querySelector('input,select,textarea')?.focus(), 30);
}
function closeDrawer() { $('#layer').innerHTML = ''; }
const opt = (map, v, blank) => (blank ? `<option value="">${esc(blank)}</option>` : '') + Object.entries(map).map(([k, l]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
const fText = (name, label, v, attrs = '') => `<label class="field">${esc(label)}<input type="text" name="${name}" value="${esc(v || '')}" ${attrs}></label>`;
const fArea = (name, label, v) => `<label class="field">${esc(label)}<textarea name="${name}" rows="2">${esc(v || '')}</textarea></label>`;
const fSel = (name, label, map, v, blank) => `<label class="field">${esc(label)}<select name="${name}">${opt(map, v, blank)}</select></label>`;
function anchorRefs(plan) {
  const out = {};
  for (const a of plan.knowledge.anchors || []) { if (a.kind === 'range') { out[a.id] = `${a.label} (start)`; out[`${a.id}:end`] = `${a.label} (end)`; } else out[a.id] = a.label; }
  return out;
}
function offsetFields(prefix, o) {
  const p = parseOffset(o);
  return `<label class="field">Amount<input type="number" name="${prefix}N" value="${p ? Math.abs(p.n) : ''}" min="0"></label>
    <label class="field">Unit<select name="${prefix}U">${opt({h: 'hours', d: 'days', w: 'weeks'}, p ? p.unit : 'd')}</select></label>
    <label class="field">Direction<select name="${prefix}S">${opt({'-': 'before', '+': 'after'}, p && p.n >= 0 ? '+' : '-')}</select></label>`;
}
function readOffset(fd, prefix) {
  const n = fd.get(prefix + 'N');
  if (n === '' || n == null) return null;
  return `${Number(n) === 0 ? '' : fd.get(prefix + 'S')}${Math.abs(Number(n))}${fd.get(prefix + 'U')}`;
}
function whenFields(plan, w, required, noPhase) {
  const mode = w?.phase ? 'phase' : w?.anchor ? 'anchor' : required ? (noPhase || !(plan.knowledge.phases || []).length ? 'anchor' : 'phase') : 'none';
  const refs = anchorRefs(plan);
  return `<fieldset class="panel form"><legend class="small muted">When</legend>
    ${fSel('wMode', 'Applies', Object.assign(required ? {} : {none: 'No particular time'}, noPhase ? {} : {phase: 'During a phase'}, {anchor: 'Relative to a key date'}), mode)}
    ${noPhase ? '' : fSel('wPhase', 'Phase', Object.fromEntries((plan.knowledge.phases || []).map(p => [p.id, p.name])), w?.phase)}
    <div class="inline">${fSel('wAnchor', 'From key date', refs, w?.anchor)}${offsetFields('wFrom', w?.from || '0d')}</div>
    <div class="inline">${fSel('wToAnchor', 'Until key date', refs, w?.toAnchor || w?.anchor)}${offsetFields('wTo', w?.to)}</div>
    <p class="small muted">Leave “until” empty for a single moment. Offsets in hours count from the key date’s time, if you set one.</p></fieldset>`;
}
function readWhen(fd) {
  const mode = fd.get('wMode');
  if (mode === 'phase') return {phase: fd.get('wPhase')};
  if (mode !== 'anchor') return null;
  const w = {anchor: fd.get('wAnchor'), from: readOffset(fd, 'wFrom') || '0d'};
  const to = readOffset(fd, 'wTo');
  if (to) { w.to = to; if (fd.get('wToAnchor') !== w.anchor) w.toAnchor = fd.get('wToAnchor'); }
  return w;
}
function pointFields(plan, prefix, label, p) {
  return `<div class="inline">${fSel(prefix + 'A', label, anchorRefs(plan), p?.anchor, 'No deadline')}${offsetFields(prefix, p?.at)}</div>`;
}
function readPoint(fd, prefix) {
  const a = fd.get(prefix + 'A');
  if (!a) return null;
  return {anchor: a, at: readOffset(fd, prefix) || '0d'};
}
function whyFields(why, nudge) {
  return `<fieldset class="panel form"><legend class="small muted">Why</legend>
    ${nudge && !why?.text ? '<p class="nudge">If the reason isn’t obvious, say it: people follow a rule they understand, even when it is inconvenient.</p>' : ''}
    ${fArea('whyText', 'Reason', why?.text)}${fSel('whyBasis', 'Based on', LABELS.basis, why?.basis, 'Not stated')}
    ${(K().sources || []).length ? `<div class="small muted">Sources</div>${K().sources.map(src => `<label class="cb"><input type="checkbox" name="whySrc" value="${esc(src.id)}"${why?.sources?.includes(src.id) ? ' checked' : ''}> ${esc(src.title)}</label>`).join('')}` : '<p class="small muted">Add sources under Settings to cite them here.</p>'}</fieldset>`;
}
function readWhy(fd, old) {
  const text = (fd.get('whyText') || '').trim();
  if (!text) return null;
  const y = {text};
  if (fd.get('whyBasis')) y.basis = fd.get('whyBasis');
  const srcs = fd.getAll('whySrc');
  if (srcs.length) y.sources = srcs;
  return y;
}
const lines = v => String(v || '').split(/\n|,/).map(s => s.trim()).filter(Boolean);

const EDITORS = {
  phases: {title: 'phase', noPrivate: true, name: it => it.name, fields: (p, it) => fText('name', 'Phase', it.name, 'required placeholder="Pre-op, On the trail…"') + fArea('summary', 'What this stretch is about', it.summary) + whenFields(p, it.when, true, true),
    read: fd => ({name: fd.get('name').trim(), summary: fd.get('summary').trim(), when: readWhen(fd)})},

      '<p class="small muted">Each person sets their own date for it when they plan. Templates only hold the name.</p>',
    read: (fd, it) => ({label: fd.get('label').trim(), kind: it.kind || fd.get('kind')})},
  sources: {title: 'source', noPrivate: true, name: it => it.title, fields: (p, it) => fText('title', 'Title', it.title, 'required') + `<label class="field">Link<input type="url" name="url" value="${esc(it.url || '')}"></label>` +
      `<div class="inline">${fSel('kind', 'Kind', {instructions: 'Instructions from the professional in charge', guideline: 'Guideline', study: 'Study', article: 'Article', forum: 'Forum', personal: 'Personal experience'}, it.kind || 'guideline')}${fText('publisher', 'Publisher', it.publisher)}</div>` +
      `<label class="field">Accessed<input type="date" name="accessed" value="${esc(it.accessed || todayStr())}"></label>`,
    read: fd => ({title: fd.get('title').trim(), url: fd.get('url').trim(), kind: fd.get('kind'), publisher: fd.get('publisher').trim(), accessed: fd.get('accessed')})},
  rules: {title: 'rule', name: it => it.title, fields: (p, it) => fText('title', 'Rule', it.title, 'required') + fArea('detail', 'What it means in practice', it.detail) +
      `<div class="inline">${fSel('kind', 'Kind', LABELS.kind, it.kind || 'do')}${fSel('strength', 'Strength', LABELS.strength, it.strength || 'should')}</div>` + whenFields(p, it.when, true) + whyFields(it.why, true),

function clean(o) { for (const k of Object.keys(o)) if (o[k] == null || o[k] === '' || o[k] === false || (Array.isArray(o[k]) && !o[k].length)) delete o[k]; return o; }
function editItem(list, id) {

function anchorDateFields(anchors, dates) {
  return anchors.map(a => {
    const d = dates[a.id] || {};
    return a.kind === 'range'
      ? `<div class="inline"><label class="field">${esc(a.label)} starts<input type="date" name="a_${a.id}_start" value="${esc(d.start || '')}"></label><label class="field">${esc(a.label)} ends<input type="date" name="a_${a.id}_end" value="${esc(d.end || '')}"></label></div>`
      : `<div class="inline"><label class="field">${esc(a.label)} date<input type="date" name="a_${a.id}_date" value="${esc(d.date || '')}"></label><label class="field">Time (optional)<input type="time" name="a_${a.id}_time" value="${esc(d.time || '')}"></label></div>`;

function readAnchorDates(fd, anchors) {
  const out = {};
  for (const a of anchors) {
    const r = a.kind === 'range' ? {start: fd.get(`a_${a.id}_start`), end: fd.get(`a_${a.id}_end`)} : {date: fd.get(`a_${a.id}_date`), time: fd.get(`a_${a.id}_time`)};
    clean(r);
    if (r.start && r.end && r.end < r.start) r.end = r.start;
    if (Object.keys(r).length) out[a.id] = r;
  }
  return out;
}

/* ---------- sharing ---------- */
const CONCRETE = ['name', 'phone', 'email', 'url', 'address', 'hours', 'notes'];
function buildExport(plan, opts) {
  const t = clone(plan.knowledge);
  const left = {};
  for (const l of LISTS) {
    const before = t[l] || [];
    t[l] = before.filter(it => !it.private && !it.hidden);
    left[l] = before.length - t[l].length;
    for (const it of t[l]) { delete it.origin; delete it.private; delete it.hidden; }
  }
  for (const c of t.contacts || []) if (!opts.keep.has(c.id)) for (const f of CONCRETE) delete c[f];
  const meds = new Set((t.meds || []).map(m => m.id)), contacts = new Set((t.contacts || []).map(c => c.id));
  for (const d of t.daily || []) { if (d.medId && !meds.has(d.medId)) delete d.medId; if (d.contactId && !contacts.has(d.contactId)) delete d.contactId; }
  for (const f of t.food || []) for (const i of f.ideas || []) if (i.contactId && !contacts.has(i.contactId)) delete i.contactId;
  for (const l of LISTS) if (!t[l].length) delete t[l];
  Object.assign(t, {id: opts.id, name: opts.name, version: (Number(plan.knowledge.version) || 0) + 1, asOf: todayStr()});
  if (opts.author) t.author = opts.author; else delete t.author;
  return {file: {format: FORMAT, formatVersion: 1, template: t}, left};
}
function exportDrawer() {
  const plan = currentPlan();
  const concrete = (plan.knowledge.contacts || []).filter(c => !c.private && !c.hidden && CONCRETE.some(f => c[f]));
  openDrawer('Export as template', `<p class="small">This file shares the knowledge in your plan. It leaves out your dates, doses, checklist ticks, packing status, bookings, personal contacts and journal, and any item you marked private or hid.</p>
    ${fText('id', 'Template id', plan.knowledge.id, 'required pattern="[a-z0-9]+(-[a-z0-9]+)*"')}${fText('name', 'Template name', plan.knowledge.name, 'required')}${fText('author', 'Author (optional, leave empty to stay anonymous)', plan.knowledge.author)}
    ${concrete.length ? `<fieldset class="panel form"><legend class="small muted">Contacts with real details</legend><p class="small muted">Tick the ones whose details should go out. Unticked ones keep only their role.</p>${concrete.map(c => `<label class="cb"><input type="checkbox" name="keep" value="${esc(c.id)}"> ${esc(c.role)}: ${esc(CONCRETE.map(f => c[f]).filter(Boolean).join(', '))}</label>`).join('')}</fieldset>` : ''}
    <details><summary class="small">Preview everything that will go out</summary><pre class="json" id="xprev"></pre></details>
    <p class="err" id="xerr"></p>
    <div class="row"><button class="btn primary">Download file</button><button type="button" class="btn" data-act="saveAsMine">Also keep in my templates</button></div>`, fd => {
    const out = buildExport(plan, readExportOpts(fd));
    const errs = checkTemplate(out.file.template);
    if (errs.length) { $('#xerr').textContent = errs.join(' '); return false; }
    download(`${out.file.template.id}.json`, out.file); toast('Template exported');
  });
  const f = $('#dform');
  const refresh = () => { const out = buildExport(plan, readExportOpts(new FormData(f))); $('#xprev').textContent = JSON.stringify(out.file, null, 2); };
  f.addEventListener('input', refresh); refresh();
}
function readExportOpts(fd) { return {id: (fd.get('id') || '').trim(), name: (fd.get('name') || '').trim(), author: (fd.get('author') || '').trim(), keep: new Set(fd.getAll('keep'))}; }
function addTemplate(t) {
  const rec = state.templates.find(r => r.template.id === t.id);
  if (rec) { rec.template = t; touch(rec); } else state.templates.push(touch({id: rid(), template: t}));
  save();
}
function download(name, obj) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
let fileMode = null;
function pickFile(mode) { fileMode = mode; const f = $('#fileIn'); f.value = ''; f.click(); }
$('#fileIn').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  let j;
  try { j = JSON.parse(await file.text()); } catch (err) { toast('That file is not valid JSON'); return; }
  if (fileMode === 'template') {
    const t = j && j.format === FORMAT ? j.template : j;
    const errs = checkTemplate(t);
    if (errs.length) { openDrawer('This template has problems', `<ul class="err">${errs.slice(0, 12).map(x => `<li>${esc(x)}</li>`).join('')}</ul><button class="btn">Close</button>`, () => {}); return; }
    addTemplate(t); render(); toast(`Added “${t.name}” to your templates`);
  } else if (fileMode === 'backup') {
    if (!j || j.version == null) { toast('That is not a Special Trip Planner backup'); return; }
    state = mergeStates(state, fixState(j)); save(); render(); toast('Backup merged in');
  }
});

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type !== 'checkbox')) return;
  const {act, id, list} = b.dataset;
  const plan = currentPlan();
  switch (act) {
    case 'tab': view = b.dataset.v; showHidden = false; render(); window.scrollTo(0, 0); break;
    case 'close': closeDrawer(); break;
    case 'startPlan': startPlanDrawer(b.dataset.tid); break;
    case 'newPlan': view = 'library'; render(); break;
    case 'importTemplate': pickFile('template'); break;
    case 'importBackup': pickFile('backup'); break;
    case 'removeTemplate': state.templates = state.templates.filter(r => r.id !== b.dataset.rec); state.deleted.push(b.dataset.rec); save(); render(); toast('Template removed; plans made from it keep their copy'); break;
    case 'day': viewDay = b.dataset.n === '0' ? todayStr() : dayStr(addDays(parseDay(viewDay), Number(b.dataset.n))); render(); break;
    case 'editPlan': editPlanDrawer(); break;
    case 'tlMode': timelineMode = b.dataset.mode; try { localStorage.setItem('specialTripPlanner.timelineMode', timelineMode); } catch (e) {} render(); break;
    case 'calDay': viewDay = b.dataset.day; view = 'today'; render(); window.scrollTo(0, 0); break;
    case 'add': editItem(list); break;
    case 'edit': editItem(list, id); break;
    case 'hide': { const it = K()[list].find(x => x.id === id); it.hidden = !it.hidden || undefined; if (!it.hidden) delete it.hidden; touch(plan); save(); render(); break; }
    case 'removeItem': {
      if (['phases', 'anchors', 'sources'].includes(list)) {
        const trial = {...K(), [list]: K()[list].filter(x => x.id !== id)};
        const used = checkTemplate(trial).filter(m => m.includes(`"${id}"`) || m.includes(`"${id}:end"`));
        if (used.length) {
          const [l, iid] = used[0].split(':')[0].split('/'), user = K()[l]?.find(x => x.id === iid);
          toast(user ? `Still used by the ${EDITORS[l]?.title || l} “${EDITORS[l]?.name ? EDITORS[l].name(user) : iid}”. Change that first.` : `Still in use: ${used[0]}`); return;
        }
      }
      K()[list] = K()[list].filter(x => x.id !== id);
      if (list === 'anchors' && plan.anchorDates) delete plan.anchorDates[id];
      touch(plan); save(); closeDrawer(); render(); toast('Removed'); break;
    }
    case 'newTemplate': newTemplateDrawer(); break;
    case 'editMeta': editMetaDrawer(); break;
    case 'toggleHidden': showHidden = !showHidden; render(); break;
    case 'check': case 'dose': {
      const listName = act === 'check' ? 'checks' : 'doses', field = act === 'check' ? 'done' : 'taken';
      const rec = state[listName].find(c => c.id === id);
      if (rec) { rec[field] = b.checked; touch(rec); } else state[listName].push(touch({id, planId: plan.id, [field]: b.checked}));
      save(); render(); break;
    }
    case 'addRegimen': regimenDrawer(b.dataset.med); break;
    case 'editRegimen': regimenDrawer(null, id); break;
    case 'delRegimen': dropRecord('regimens', id); save(); closeDrawer(); render(); break;
    case 'addPerson': personDrawer(b.dataset.role); break;
    case 'editPerson': personDrawer(null, id); break;
    case 'delPerson': dropRecord('people', id); save(); closeDrawer(); render(); break;
    case 'bookDone': setBooking(id, 'done', b.checked); break;
    case 'addJournal': { const text = $('#jText').value.trim(); if (!text) return; state.journal.push(touch({id: rid(), planId: plan.id, date: $('#jDate').value || todayStr(), text})); save(); render(); toast('Note added'); break; }
    case 'delJournal': dropRecord('journal', id); save(); render(); break;
    case 'exportTemplate': exportDrawer(); break;
    case 'saveAsMine': { const out = buildExport(plan, readExportOpts(new FormData($('#dform')))); const errs = checkTemplate(out.file.template); if (errs.length) { $('#xerr').textContent = errs.join(' '); return; } addTemplate(out.file.template); toast('Kept in your templates'); break; }
    case 'exportBackup': download(`Special Trip Planner backup ${todayStr()}.json`, state); break;
    case 'deletePlan': confirmDrawer(`Delete “${plan.name}”?`, 'This removes the plan and all its private tracking from this browser. Export a backup first if you might want it back.', () => {
      for (const k of PRIVATE_LISTS) for (const r of state[k].filter(r => r.planId === plan.id)) dropRecord(k, r.id);
      dropRecord('plans', plan.id); state.settings.currentPlan = state.plans[0]?.id || null; touchSettings(); save(); view = 'today'; render(); toast('Plan deleted');
    }); break;
    case 'eraseAll': confirmDrawer('Erase everything?', 'All plans, your templates and private tracking are removed from this browser.', () => {
      const ids = [...state.plans, ...state.templates, ...PRIVATE_LISTS.flatMap(k => state[k])].map(r => r.id);
      state = {...emptyState(), deleted: state.deleted.concat(ids)}; touchSettings(); save(); render(); toast('Everything erased');
    }); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'packStatus') {
    const plan = currentPlan(), id = `${plan.id}|${t.dataset.id}`;
    const rec = state.packStatus.find(s => s.id === id);
    if (rec) { rec.status = t.value; touch(rec); } else state.packStatus.push(touch({id, planId: plan.id, itemId: t.dataset.id, status: t.value}));
    save(); render();
  } else if (t.dataset.act === 'bookField') setBooking(t.dataset.id, t.dataset.field, t.value.trim());
  else if (t.id === 'planSel') { if (t.value === '__new') { view = 'library'; } else { state.settings.currentPlan = t.value; touchSettings(); } save(); render(); }
});
function setBooking(itemId, field, value) {
  const plan = currentPlan(), id = `${plan.id}|${itemId}`;
  let rec = state.bookings.find(b => b.id === id);
  if (!rec) { rec = {id, planId: plan.id, logisticsId: itemId}; state.bookings.push(rec); }
  rec[field] = value; touch(rec); save();
  if (field === 'done') render();
}
function confirmDrawer(title, text, yes) { openDrawer(title, `<p>${esc(text)}</p><div class="row"><button class="btn danger">Yes, go ahead</button><button type="button" class="btn" data-act="close">Cancel</button></div>`, () => { yes(); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeDrawer(); });
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ---------- render ---------- */
function render() {
  const plan = currentPlan();
  if (plan && state.settings.currentPlan !== plan.id) state.settings.currentPlan = plan.id;
  $('#planPick').innerHTML = state.plans.length ? `<label class="small muted" for="planSel">Plan</label><select id="planSel">${state.plans.map(p => `<option value="${esc(p.id)}"${plan && p.id === plan.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__new">New plan…</option></select>` : '';
  const tabs = plan ? TABS : TABS.filter(([v]) => v === 'library' || v === 'settings');
  if (!tabs.some(([v]) => v === view)) view = plan ? 'today' : 'library';
  $('#tabs').innerHTML = tabs.map(([v, l]) => `<button data-act="tab" data-v="${v}" aria-selected="${v === view}">${l}</button>`).join('');
  const views = {today: renderToday, timeline: renderTimeline, meds: renderMeds, packing: renderPacking, food: renderFood, contacts: renderContacts, logistics: renderLogistics, journal: renderJournal, settings: renderSettings,
    library: () => plan ? `<section class="stack"><h2>Templates</h2><p class="small muted">Start another plan, or import a template someone shared with you. Imported templates stay in your browser and never go into the app's repo.</p>${libraryHtml()}</section>` : renderStart()};
  $('#main').innerHTML = views[view]();
}

loadBuiltIns().then(render);
render();
</script>
